<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Medya | Sizler İçin Hazırlanıyor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen flex items-center justify-center p-6 selection:bg-neutral-800">

    <main class="text-center max-w-md flex flex-col items-center">
        <!-- 
          LOGO ALANI:
          Doğrudan Resmim.net CDN bağlantısı entegre edilmiştir.
        -->
        <div class="mb-8 w-64 sm:w-80 max-w-full flex justify-center items-center">
            <img 
                src="https://resmim.net/cdn/2026/10/26/HjuFqy.png" 
                alt="Aura Creative Logo" 
                class="w-full h-auto object-contain max-h-48"
                onerror="this.onerror=null; this.src='https://placehold.co/400x200/000000/EDE8E1?text=aura+Creative';"
            />
        </div>

        <!-- Sade Durum Metni -->
        <p class="text-sm sm:text-base font-light text-neutral-400 tracking-wide mb-8">
            Sizler için hazırlanıyor...
        </p>

        <!-- İnce Çizgi Şeklinde Animasyonlu Yükleniyor Göstergesi -->
        <div class="w-24 h-[1px] bg-neutral-900 mx-auto overflow-hidden relative">
            <div class="w-full h-full bg-neutral-400 animate-[pulse_2s_cubic-bezier(0.4,0,0.6,1)_infinite]"></div>
        </div>
    </main>

</body>
</html>
